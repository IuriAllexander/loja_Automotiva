{% extends 'base.html' %}

{% block title %}
Cadastro | Marquinhos Autopeças
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <span class="tag">Novo Cliente</span>

        <h1>Crie sua Conta</h1>

        <p>
            Cadastre-se para acompanhar pedidos, salvar produtos favoritos e aproveitar ofertas exclusivas.
        </p>

        <form class="auth-form" method="post">

            {% csrf_token %}

            <div class="input-group">
                <label>Nome Completo</label>
                <input
                    type="text"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >
            </div>

            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Digite seu email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Telefone</label>
                <input
                    type="tel"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input
                    type="password"
                    name="senha"
                    placeholder="Crie uma senha"
                    required
                >
            </div>

            <div class="input-group">
                <label>Confirmar Senha</label>
                <input
                    type="password"
                    name="confirmar_senha"
                    placeholder="Repita sua senha"
                    required
                >
            </div>

            <button type="submit" class="btn-secondary">
                Criar Conta
            </button>

        </form>

        <div class="auth-footer">
            Já possui uma conta?
            <a href="{% url 'login' %}">
                Entrar
            </a>
        </div>

    </div>

</section>

{% endblock %}
