{% extends 'base.html' %}

{% block title %}
Login | Marquinhos Autopeças
{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <span class="tag">Área do Cliente</span>

        <h1>Entrar</h1>

        <p>
            Faça login para acessar seus pedidos, favoritos e informações da sua conta.
        </p>

        <form class="auth-form" method="post">

            {% csrf_token %}

            <div class="input-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Digite seu email"
                    required
                >
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input
                    type="password"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button type="submit" class="btn-secondary">
                Entrar
            </button>

        </form>

        <div class="login-options">
            <a href="#">Esqueceu sua senha?</a>
        </div>

        <div class="auth-footer">
            Ainda não possui conta?
            <a href="{% url 'cadastro' %}">
                Cadastre-se
            </a>
        </div>

    </div>

</section>

{% endblock %}
